# Linux i386 Qt5 Build Target                               #
#-----------------------------------------------------------#
"Linux i386 Qt5":
  variables:
    TGT_ARCH: "i386"
    TGT_QT: "qt5"
    TGT_NAME: "${TGT_ARCH}_qt5"
    TGT_PATH: "${TGT_ARCH}"
  <<: *linux_script_steps

